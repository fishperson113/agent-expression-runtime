[package]
name = "agent-expression-runtime"
version = "0.1.0"
description = "Bounded declarative expression runtime"
edition = "2021"
default-run = "agent-expression-runtime"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[[bin]]
name = "agent-expression-runtime"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "fisch-gateway"
path = "src/gateway_main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "net", "macros"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23.1"
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
futures-core = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
