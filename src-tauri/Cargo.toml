[package]
name = "agent-expression-runtime"
version = "0.1.0"
description = "Bounded declarative expression runtime"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "net", "macros"] }
axum = "0.8"
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
futures-core = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
